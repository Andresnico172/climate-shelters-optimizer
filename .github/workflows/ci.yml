name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check src tests app scripts
      - name: Tests (exact solvers vs brute force, heuristics, simulation, app smoke test)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t climate-shelters .
      - name: Smoke-test container
        run: |
          docker run -d -p 8501:8501 --name app climate-shelters
          for i in $(seq 1 30); do curl -sf localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs app; exit 1
